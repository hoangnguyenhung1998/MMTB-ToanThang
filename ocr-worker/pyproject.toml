[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmtb-ocr-worker"
version = "0.1.0"
description = "External RapidOCR worker for MMTB-ToanThang"
requires-python = ">=3.12"
dependencies = [
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10.4,<13",
    "requests>=2.32,<3",
]

[project.scripts]
mmtb-ocr-worker = "mmtb_ocr_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
