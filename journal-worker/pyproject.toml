[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmtb-journal-worker"
version = "0.1.0"
description = "External 9router/OpenClaw vision worker for MMTB weekly journals."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
]

[project.scripts]
mmtb-journal-worker = "mmtb_journal_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
