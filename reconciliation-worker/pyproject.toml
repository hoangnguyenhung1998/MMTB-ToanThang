[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmtb-reconciliation-worker"
version = "0.1.0"
description = "OpenClaw exception reconciliation worker for MMTB."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
]

[project.scripts]
mmtb-reconciliation-worker = "mmtb_reconciliation_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
