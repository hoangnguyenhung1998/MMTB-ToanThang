[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmtb-gmail-intake-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.170,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.scripts]
mmtb-gmail-intake-worker = "mmtb_gmail_intake_worker.__main__:main"
mmtb-gmail-intake-auth = "mmtb_gmail_intake_worker.auth:main"

[tool.setuptools.packages.find]
where = ["src"]
