name: Phase 16.9 daily photos
on:
  push:
    branches: [feature/phase-16-9-daily-photo-reconciliation]
  pull_request:
    branches: [production]
permissions:
  contents: read
jobs:
  daily-photo-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, zip
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/phpunit --filter='DailyTimeAllocatorTest|DailyPhotoWorkflowTest|Reconciliation|OcrJobTest|ZaloIngestionTest|AutomationHealthTest'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./ocr-worker
      - run: python -m unittest discover -s ocr-worker/tests -v
        env:
          PYTHONPATH: ocr-worker/src
      - run: python -m unittest discover -s automation-health-agent/tests -v
      - run: pip install -e ./journal-worker -e ./reconciliation-worker
      - run: python -m unittest discover -s journal-worker/tests -v
      - run: python -m unittest discover -s reconciliation-worker/tests -v

  dossier-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      DOSSIERS_AI_ENABLED: 'false'
      DOSSIERS_AI_AUTO_ANALYZE: 'false'
      DOSSIERS_PDFTOPPM: /usr/bin/pdftoppm
      DOSSIERS_PDFINFO: /usr/bin/pdfinfo
      DOSSIERS_QPDF: /usr/bin/qpdf
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, zip
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: cp .env.example .env
      - name: PDF tools for Linux compatibility tests
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
      - run: php artisan test --compact --filter='Dossier(Ai)?Test'
      - name: Synthetic PDF diagnostics after failure
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then
            grep 'dossier.pdf.tool' storage/logs/laravel.log | tail -n 12 || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./journal-worker
      - run: python -m unittest discover -s journal-worker/tests
        env:
          PYTHONPATH: journal-worker/src
